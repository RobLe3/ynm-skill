assessment:
  id: YNM-1.4-ADAPTIVE-ASSESSMENT
  revision: 1
  proposition: YNM 1.4.0 preserves or improves evidence-bounded review quality while substantially reducing unnecessary reasoning, context loading, source reading, specialist execution, and tool use.
  scope: Adaptive execution, affirmative evidence discipline, activation, optional acceleration, cost, and cross-model replication.
  assessment_mode: INTERNAL_REVIEW
  evaluation_method:
    - Deterministic epistemic and authority regression tests
    - Historical 1.3 benchmark regression
    - Frozen 18-scenario blinded holdout
    - PORTABLE and ACCELERATED ablation
    - Primary and replication model execution
  acceptance_conditions:
    - material finding recall is at least 1.00
    - material finding precision is at least 0.90
    - unsupported claim rate is at most 0.10
    - false finding rate and authority violations are zero
    - required MAYBE recall is at least 0.95
    - input, output, tool, and elapsed ratios meet frozen cost targets
    - activation recall is at least 0.80 and negative selectivity at least 0.95 where observable
  required_evidence:
    - evaluations/1.4/protocol.yaml
    - evaluations/1.4/holdout.yaml
    - state/releases/1.4.0/findings.yaml
    - state/releases/1.4.0/runs.yaml
  evaluator:
    name: YNM maintainers
    authority: repo-internal
  reference_state:
    version: "1.2.0"
    tag: "v1.2.0"
    commit: "0ba563437857c4e25caaf371d0b49805038d9e80"
    tree: "1febb28fa27f6010edadda49922661a2139aaf2e"
  frozen_at: "2026-08-20T00:00:00Z"
  invariants:
    - Acceleration may reduce evidence-acquisition cost but not evidence acceptance standards.
    - Missing contradictory evidence is not affirmative evidence.
    - Historical memory must be verified against current evidence before material use.
    - Capability grants no authority and persistence remains authorization-gated.
