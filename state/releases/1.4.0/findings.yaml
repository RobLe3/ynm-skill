findings:
- id: YNM-140-EPI-001
  title: Affirmative evidence discipline
  proposition: YNM requires affirmative support and sufficient bounded coverage before
    assigning YES.
  source_loop: Implementation
  scope: disposition semantics
  observation: The primary holdout retained required MAYBEs in aggregate but produced
    a non-zero false-finding rate; replication also produced false material findings.
  evidence:
  - evaluations/1.4/results/summary.md
  - evaluations/1.4/results/holdout/benchmark-summary.yaml
  - evaluations/1.4/results/trigger-summary.yaml
  - evaluations/1.4/capability-discovery.yaml
  interpretation: The frozen epistemic target was not met.
  proposed_disposition: 'NO'
  disposition: 'NO'
  created_at: '2026-08-20T00:00:00Z'
  updated_at: '2026-08-20T00:00:00Z'
  history:
  - YNM-1.4-E001
  - YNM-1.4-E002
  status: RESOLVED
  maturity_impact: RELEASE_BLOCKING
  revisit_conditions: Complete the frozen clean-project and holdout evaluation.
  disposition_reason: The frozen epistemic target was not met.
