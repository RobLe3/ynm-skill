  - YNM-1.4-E002
  status: RESOLVED
  maturity_impact: RELEASE_BLOCKING
  revisit_conditions: Complete primary cost comparison.
  disposition_reason: Every frozen cost target was missed.
- id: YNM-140-ACT-001
  title: Lightweight activation
  proposition: Natural project-review requests reliably enter YNM-0 while negative
    cases remain inactive.
  source_loop: Adoption
  scope: activation
  observation: All 200 trigger runs completed, but the frozen smoke test selected
    NOT_OBSERVED.
  evidence:
  - evaluations/1.4/results/summary.md
  - evaluations/1.4/results/holdout/benchmark-summary.yaml
  - evaluations/1.4/results/trigger-summary.yaml
  - evaluations/1.4/capability-discovery.yaml
  interpretation: Unavailable activation telemetry cannot establish recall or selectivity.
  proposed_disposition: 'MAYBE'
  disposition: 'MAYBE'
  created_at: '2026-08-20T00:00:00Z'
  updated_at: '2026-08-20T00:00:00Z'
  history:
  - YNM-1.4-E001
  - YNM-1.4-E002
  status: OPEN
  maturity_impact: RELEASE_BLOCKING
  revisit_conditions: Execute frozen trigger evaluation.
  disposition_reason: Unavailable activation telemetry cannot establish recall or
    selectivity.
- id: YNM-140-ACC-001
  title: Optional acceleration effectiveness
  proposition: ACCELERATED mode preserves dispositions and provenance while reducing
    a material resource dimension with safe PORTABLE fallback.
  source_loop: Implementation
  scope: optional acceleration
  observation: Ruflo/RuVector structural tools responded, but project-scoped semantic
    retrieval and isolated memory did not pass smoke validation; no accelerated ablation
    ran.
  evidence:
  - evaluations/1.4/results/summary.md
  - evaluations/1.4/results/holdout/benchmark-summary.yaml
  - evaluations/1.4/results/trigger-summary.yaml
  - evaluations/1.4/capability-discovery.yaml
  interpretation: Acceleration benefit remains unmeasured.
  proposed_disposition: 'MAYBE'
  disposition: 'MAYBE'
  created_at: '2026-08-20T00:00:00Z'
  updated_at: '2026-08-20T00:00:00Z'
  history:
  - YNM-1.4-E001
  - YNM-1.4-E002
  status: OPEN
  maturity_impact: NON_BLOCKING
  revisit_conditions: Run capability smoke tests and ablation where available.
  disposition_reason: Acceleration benefit remains unmeasured.
- id: YNM-140-REP-001
  title: Cross-model replication
  proposition: YNM 1.4 effectiveness and safety reproduce across the frozen primary
    and replication models.
  source_loop: Adoption
  scope: replication
  observation: Replication holdout treatment reduced recall, increased false findings,
    and failed frozen non-inferiority rules.
  evidence:
  - evaluations/1.4/results/summary.md
  - evaluations/1.4/results/holdout/benchmark-summary.yaml
  - evaluations/1.4/results/trigger-summary.yaml
  - evaluations/1.4/capability-discovery.yaml
  interpretation: Safe cross-model replication was not established.
  proposed_disposition: 'NO'
  disposition: 'NO'
  created_at: '2026-08-20T00:00:00Z'
  updated_at: '2026-08-20T00:00:00Z'
  history:
