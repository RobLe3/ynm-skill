  title: Lifecycle transition contract
  proposition: YNM 1.3.0 includes Analysis, Iteration, and Delivery as distinct but
    bounded phases.
  source_loop: Architecture
  scope: lifecycle
  observation: Reviewed the lifecycle contract, loop contracts, and run-receipt requirements
    against the updated schema.
