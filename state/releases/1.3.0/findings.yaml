- id: YNM-EVAL-001
  title: Two-model empirical review evaluation
  proposition: The precommitted two-model trigger and A/B benchmark provides evidence that YNM improves model-assisted project review.
  source_loop: Adoption
  scope: empirical effectiveness
  observation: The frozen rubric and ten benchmark fixtures are available, but the required GPT-5.4 mini snapshot is unavailable through the authenticated Codex client.
  evidence:
  - evaluations/rubric.yaml
  - evaluations/scenarios.yaml
  - evaluations/results/model-availability.yaml
  interpretation: Executing only the available model would have violated revision 1. Revision 2 preserves this history and evaluates core effectiveness, trigger selectivity, and replication as YNM-EMP-001 through YNM-EMP-003.
  proposed_disposition: 'MAYBE'
  disposition: 'MAYBE'
  disposition_reason: The required second model is unavailable; no comparative effectiveness result exists.
  created_at: '2026-08-20T07:40:37Z'
  updated_at: '2026-08-20T07:40:37Z'
  history:
  - YNM-1.3-E011
  status: OPEN
  maturity_impact: RELEASE_BLOCKING
  revisit_conditions: Run the frozen trigger and A/B suites when both precommitted model identifiers are available, or create an explicit assessment revision before substituting a model.
- id: YNM-EMP-001
  title: Core empirical effectiveness
  proposition: Under controlled model, project, prompt, toolset, and read-only authority, making YNM available produces review quality that is measurably better than, or at minimum safely non-inferior to, the same executor without YNM.
  source_loop: Adoption
  scope: controlled primary-model empirical effectiveness
  observation: Protocol revision 2 is frozen before empirical execution on gpt-5.6-sol.
  evidence: [evaluations/protocol.yaml, evaluations/rubric.yaml, evaluations/scenarios.yaml]
  interpretation: Core effectiveness can be evaluated independently of second-model entitlement.
  proposed_disposition: 'MAYBE'
  disposition: 'MAYBE'
  disposition_reason: No revision 2 benchmark output has yet been observed.
  created_at: '2026-08-20T08:03:23Z'
  updated_at: '2026-08-20T08:03:23Z'
  history: [YNM-1.3-E012]
  status: OPEN
  maturity_impact: RELEASE_BLOCKING
  revisit_conditions: Execute and blindly score the frozen primary CONTROL/YNM benchmark.
- id: YNM-EMP-002
  title: Trigger selectivity
  proposition: YNM activates reliably for intended YNM review requests and remains inactive for the frozen negative and near-miss cases.
  source_loop: Adoption
  scope: frozen trigger suite
  observation: Activation observability will be established with a non-benchmark smoke request before the frozen trigger suite is consumed.
  evidence: [evaluations/protocol.yaml, tests/data/trigger-cases.yaml]
  interpretation: Telemetry limitations must remain MAYBE rather than guessed activation outcomes.
  proposed_disposition: 'MAYBE'
  disposition: 'MAYBE'
  disposition_reason: Trigger execution has not started.
  created_at: '2026-08-20T08:03:23Z'
  updated_at: '2026-08-20T08:03:23Z'
  history: [YNM-1.3-E012]
  status: OPEN
  maturity_impact: RELEASE_BLOCKING
  revisit_conditions: Establish activation observability and execute the frozen trigger suite.
- id: YNM-EMP-003
  title: Cross-model replication
  proposition: The observed YNM effect reproduces on a second materially different model or capability tier.
  source_loop: Adoption
  scope: frozen replication model order
  observation: Replication selection depends only on current availability in the frozen candidate order.
  evidence: [evaluations/protocol.yaml, evaluations/rubric.yaml]
  interpretation: External model entitlement is a capability boundary and does not determine primary effectiveness.
  proposed_disposition: 'MAYBE'
  disposition: 'MAYBE'
  disposition_reason: No replication executor has yet been selected under revision 2.
  created_at: '2026-08-20T08:03:23Z'
  updated_at: '2026-08-20T08:03:23Z'
  history: [YNM-1.3-E012]
  status: OPEN
  maturity_impact: NON_BLOCKING
  revisit_conditions: Probe the frozen candidate order and execute replication if one candidate is available.
