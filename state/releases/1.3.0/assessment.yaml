assessment:
  id: YNM-LIFECYCLE-CANDIDATE-20260819-164900
  revision: 1
  proposition: The explicit Analysis → Iteration → Delivery lifecycle, explicit delivery termination, and bounded rerun policy for YNM 1.3.0 preserve semantics while making terminal outcomes and uncertainty handling more auditable.
  scope: YNM runtime and review-cycle behavior, project integration boundaries, packaging correctness, and candidate release evidence.
  assessment_mode: INTERNAL_REVIEW
  evaluation_method:
    - Architecture, implementation, adoption, maintenance, disposition, and meta loops
    - Deterministic lifecycle boundary tests
    - Project integration security tests and rollback checks
    - Draft 2020-12 schema validation and cross-file schema checks
    - Package build and Agent Skills reference validation
    - Release-integrity and sanitization checks against immutable history
  acceptance_conditions:
    - delivery is emitted on every terminal path
    - information-gain rules prevent redundant iteration
    - path traversal, symlink, marker, and ownership boundaries are enforced
    - candidate manifest includes only intended runtime files
    - historical 1.2.0 evidence is validated from git objects
    - no unresolved required baseline integrity conditions remain in 1.3.0
  required_evidence:
    - state/releases/1.3.0/baseline-hashes.yaml
    - state/releases/1.3.0/final-assessment.yaml
    - state/releases/1.3.0/findings.yaml
    - state/releases/1.3.0/runs.yaml
    - state/releases/1.3.0/gates.yaml
    - tests/test_validate_ynm.py
    - validation/validate_ynm.py
  evaluator:
    name: YNM maintainers
    authority: repo-internal
  reference_state:
    version: "1.2.0"
    tag: "v1.2.0"
    commit: "0ba563437857c4e25caaf371d0b49805038d9e80"
    tree: "1febb28fa27f6010edadda49922661a2139aaf2e"
  frozen_at: "2026-08-19T16:49:00Z"
  invariants:
