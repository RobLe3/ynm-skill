- id: YNM-META-001
  title: Meta Loop terminal control is underspecified
  proposition: Meta Loop pseudocode yields a defined terminal outcome or justified
    continuation for every execution path.
  source_loop: Meta
  scope: loops/meta.md algorithm
  observation: The baseline algorithm can reach the post-loop branch without assigning
    a terminal outcome, and rerun selection is not enclosed by a complete control
    loop.
  evidence:
  - loops/meta.md
  interpretation: Independent implementations may silently stop or report an undefined
    receipt.
  proposed_disposition: 'YES'
  disposition: 'YES'
  disposition_reason: Controlled revision and validation evidence now support the
    proposition.
  maturity_impact: MATURITY_BLOCKING
  action_recommendation: Rewrite the pseudocode as an explicit bounded generation
    loop with a terminal fallback.
  owner: Meta
  dependencies:
  - YNM-IMPL-001
  revisit_conditions:
  - Algorithm terminal-path validation passes.
  status: RESOLVED
  created_at: '2026-08-19T14:51:00Z'
  updated_at: '2026-08-19T15:20:00Z'
  history:
  - YNM-EVENT-006
  - YNM-EVENT-106
  resolution_evidence:
  - loops/meta.md
  - validation/validate_ynm.py
- id: YNM-IMPL-003
  title: YAML may coerce YES and NO into booleans
  proposition: Portable YAML YNM records preserve disposition values as strings across
    common parsers.
  source_loop: Implementation
  scope: YAML serialization guidance and persisted examples
  observation: PyYAML safe loading coerced unquoted NO in the Generation 0 ledger
    to boolean false.
  evidence:
  - validation/validate_ynm.py first Generation 1 run
  interpretation: Unquoted dispositions can violate the public contract despite appearing
    correct to a human reader.
  proposed_disposition: 'YES'
  disposition: 'YES'
  disposition_reason: Controlled revision and validation evidence now support the
    proposition.
  maturity_impact: MATURITY_BLOCKING
  action_recommendation: Require quoted YES/NO/MAYBE in YAML examples and validate
    parsed types.
  owner: Implementation
  dependencies:
  - YNM-IMPL-002
  revisit_conditions:
  - Every structured YAML disposition parses as a canonical string.
  status: RESOLVED
  created_at: '2026-08-19T15:05:00Z'
  updated_at: '2026-08-19T15:20:00Z'
  history:
  - YNM-EVENT-007
  - YNM-EVENT-107
  resolution_evidence:
  - contracts/finding.md
  - examples/data/finding.yaml
  - validation/validate_ynm.py
- id: YNM-VAL-001
  title: No independent third-party implementation was available in this maturation
    run
  proposition: A separate third party has independently implemented YNM from the public
    artifacts and reproduced compatible results.
  source_loop: Adoption
  scope: external implementation validation
  observation: The current environment exposed no independent evaluator or external
    implementation under test.
  evidence:
  - state/execution-contexts.yaml
  interpretation: Portability is supported by provider-neutral contracts, schemas,
    manual execution, and extension validation, but external reproduction remains
    unobserved.
  proposed_disposition: "MAYBE"
  disposition: "MAYBE"
  disposition_reason: EVIDENCE_REQUIRED
  maturity_impact: NON_BLOCKING
  impact: External interoperability has design and local validation evidence but no
    independent field evidence.
  action_recommendation: Invite an independent implementation and compare exchanged
    records without changing canonical contracts.
  authorization_status: NOT_REQUESTED
  owner: Adoption
  dependencies: []
  revisit_conditions:
  - An independent implementation executes generic and specialist review using only
    public YNM artifacts.
  status: OPEN
  created_at: '2026-08-19T15:30:00Z'
  updated_at: '2026-08-19T15:30:00Z'
  history:
  - YNM-EVENT-201
