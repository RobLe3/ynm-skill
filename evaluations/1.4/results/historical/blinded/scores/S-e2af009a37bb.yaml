rationale: The output correctly identifies, with a precise RUNBOOK.md citation, that
  the recovery procedure has not been exercised in a production-like environment,
  supporting the sole material proposition. It does not claim production readiness
  and documents a bounded read-only lifecycle. However, it never preserves the required
  MAYBE that the procedure works in production; evidence that execution is unavailable
  supports uncertainty about whether it works, not a definitive disposition on that
  proposition. The additional MAYBE findings are explicitly tied to absent evidence
  and are therefore not unjustified.
