rationale: The output identifies the documented exactly-once retry contract and ties
  the conflicting retry_limit == 3 expectation to test_retry.py:2, semantically capturing
  the ground-truth contradiction with strong traceability. However, it overstates
  this as an implementation mismatch without evidence about implementation behavior,
  so that additional material claim is unsupported. It does not preserve the required
