rationale: The output correctly identifies the contract/test contradiction and traces
  it to specific file lines. However, the additional claims that no implementation
  or fixture exists and that the test fails during setup are not tied to shown fixture
  or execution evidence. It also fails to preserve the required possibility that the
  tested behavior may be intended, instead prescribing the documented one-retry behavior
  and a test change. No documentation was rewritten, no changes were made, and the
  bounded review lifecycle is clearly reported.
