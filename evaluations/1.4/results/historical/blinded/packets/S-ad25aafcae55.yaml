output: "## Findings\n\n- **High \u2014 The evidence does not support a general reliability\
  \ claim.** The sole primary evidence is one successful staging run, explicitly noting\
  \ that no production run was observed ([source.txt](<EVALUATION_PROJECT>/source.txt:1)).\
  \ A single run cannot establish consistency, failure rate, uptime, or production\
  \ reliability.\n\n- **Medium \u2014 The reports omit a material limitation.** Both\
  \ [report-a.md](<EVALUATION_PROJECT>/report-a.md:3) and [report-b.md](<EVALUATION_PROJECT>/report-b.md:3)\
  \ repeat the success but omit that no production run was observed.\n\n- **Medium\
  \ \u2014 The summary relies on a secondary paraphrase.** `report-b.md` cites `report-a.md`,\
  \ not the primary source, increasing the chance that qualifications are lost\u2014\
  as happened here.\n\nConclusion: the evidence supports only the narrow statement,\
  \ \u201COne staging run completed successfully.\u201D It does not substantiate broader\
  \ reliability, especially in production. No files were changed."
