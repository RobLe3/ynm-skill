raw_output: "YNM is a careful way to review a software project using evidence.\n\n\
  Think of it as answering one precise question at a time\u2014such as, \u201CIs this\
  \ feature ready for production?\u201D\u2014with one of three conclusions:\n\n- **YES:**\
  \ Evidence supports the claim.\n- **NO:** Evidence contradicts it.\n- **MAYBE:**\
  \ The available evidence isn\u2019t enough or conflicts.\n\nThe basic process is:\n\
  \n1. Define exactly what claim is being reviewed.\n2. Inspect relevant code, tests,\
  \ documentation, and project instructions.\n3. Separate observed facts from interpretations\
  \ and recommendations.\n4. Investigate only as deeply as the risk warrants.\n5.\
  \ Report what was reviewed, what wasn\u2019t, and why the conclusion is justified.\n\
  \nYNM starts with the cheapest useful review and escalates only when more investigation\
  \ could materially improve the answer. Most reviews stop at a focused evaluation;\
  \ high-stakes claims may receive specialist or adversarial scrutiny.\n\nTwo important\
  \ rules are:\n\n- \u201CNothing appears wrong\u201D is not enough for **YES**; affirmative\
  \ evidence is required.\n- A finding is not permission to change anything. YNM is\
  \ read-only unless the user explicitly authorizes edits.\n\nIn short: **YNM helps\
  \ prevent confident guesses by making project reviews bounded, evidence-backed,\
  \ and honest about uncertainty.**"
