raw_output: "YNM is a structured way to review a project using evidence instead of\
  \ intuition.\n\nIt works like this:\n\n1. **Turn the question into a precise claim**\
  \  \n   For example: \u201CIs this project ready for production?\u201D\n\n2. **Inspect\
  \ relevant evidence**  \n   YNM checks the smallest useful set of code, tests, documentation,\
  \ configuration, and project history.\n\n3. **Give the claim one result**\n\n  \
  \ - **YES** \u2014 evidence supports it.\n   - **NO** \u2014 evidence contradicts\
  \ it.\n   - **MAYBE** \u2014 the available evidence cannot settle it.\n\n4. **Dig\
  \ deeper only when worthwhile**  \n   YNM has four levels:\n\n   - **YNM-0:** define\
  \ and route the question.\n   - **YNM-1:** perform a focused review; this is enough\
  \ for most tasks.\n   - **YNM-2:** add relevant specialist perspectives.\n   - **YNM-3:**\
  \ perform deeper or adversarial assurance for high-risk decisions.\n\n5. **Report\
  \ limits honestly**  \n   It identifies what was reviewed, what was not, conflicting\
  \ evidence, and why it stopped.\n\nThe central idea is: **not finding a problem\
  \ does not prove everything is correct**. YNM says YES only when there is affirmative\
  \ evidence and sufficient coverage; otherwise, uncertainty remains MAYBE.\n\nBy\
  \ default, YNM reviews without changing anything. Finding a problem also does not\
  \ automatically authorize it to edit the project."
