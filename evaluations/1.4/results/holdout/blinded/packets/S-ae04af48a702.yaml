output: '## Verdict


  **Not production-ready based on available evidence.**


  ### Readiness blockers


  - No production rollout or deployment evidence.

  - No monitoring, alerting, or observability evidence.

  - No backup, rollback, disaster-recovery, or recovery-test evidence.

  - No source code, test files, build manifests, dependency locks, CI configuration,
  or security controls were available for inspection.

  - The directory is not a Git repository, so change history, review status, provenance,
  and release tagging cannot be verified.


  The only artifact, [PROJECT.md](<EVALUATION_PROJECT>/PROJECT.md:1), states that
  unit and integration tests pass, but provides no executable tests, logs, timestamps,
  coverage, CI results, or environment details. Treat this as an uncorroborated assertion.


  ### Evidence boundary


  Verified read-only:


  - Workspace contents: exactly one 108-byte file.

  - Absence of Git metadata.

  - The readiness claims and acknowledged evidence gaps in `PROJECT.md`.


  Not verified:


  - Application behavior, security, dependencies, performance, scalability, deployment,
  monitoring, rollback, data protection, or test results.


  No files were modified, and no tests were run because no test implementation or
  runner configuration exists in the supplied workspace.'
