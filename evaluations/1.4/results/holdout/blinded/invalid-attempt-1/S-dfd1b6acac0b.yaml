rationale: The output identifies both missing security review and missing publication
  authorization and ties them to PROJECT.md, satisfying the single material proposition
  with strong evidence traceability. It remains read-only and clearly bounds the review
  lifecycle. However, it concludes definitively that the release is not ready rather
  than preserving the required MAYBE for publication readiness. Its MAYBE label for
  security review is also unjustified because the cited evidence explicitly establishes
  that the review is absent. The otherwise useful release-gate guidance does not cure
  the disposition error.
