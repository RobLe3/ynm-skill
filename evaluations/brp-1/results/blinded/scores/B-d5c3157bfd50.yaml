rationale: The result is inspectable, read-only, advisory, and strongly traceable
  to the indexed snapshot. It clearly separates reviewed and unreviewed scope, identifies
  absent records, provides temporal and hash references, and avoids certification.
  However, the required deployment-record proposition is not stated directly as unresolved;
  P4 substitutes a broader bundle of correctness, compliance, completeness, and safety
  claims, while P2 and P3 conclusively address inclusion and review. The boundary
  is usable but omits an explicit executor profile and only implies parts of the execution
  limits, so required-maybe preservation, proposition scope, and boundary visibility
  have important omissions. No ground-truth material proposition was supplied, so
  no material findings are counted.
