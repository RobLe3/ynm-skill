rationale: The output identifies the unavailable recovery-execution evidence and directly
  traces it to RUNBOOK.md line 3, which states that the restore procedure has not
  been exercised in a production-like environment. It preserves uncertainty about
  whether the procedure works in production by distinguishing lack of validation from
  proof of failure and by using MAYBE for readiness. It does not claim production
  readiness, remains read-only, records completion, and gives a bounded reassessment
  trigger.
