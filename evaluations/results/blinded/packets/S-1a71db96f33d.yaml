output: "Read-only review complete. The project is not currently runnable.\n\n###\
  \ Architecture\n\n- **High \u2014 storage boundary is incomplete.** The architecture\
  \ requires the service to read storage, but no `storage` module or interface is\
  \ present. The sole adapter import fails at startup. [ARCHITECTURE.md](<EVALUATION_PROJECT>/ARCHITECTURE.md:3),\
  \ [service.py](<EVALUATION_PROJECT>/service.py:1)\n\n- **Medium \u2014 service contract\
  \ is undefined.** `list_items()` exposes raw storage output with no documented item\
  \ schema, error behavior, or pagination/filtering expectations, coupling callers\
  \ to whichever storage implementation eventually appears. [service.py](<EVALUATION_PROJECT>/service.py:3)\n\
  \n### Implementation\n\n- **Critical \u2014 startup fails.** Running `python cli.py`\
  \ raises `ModuleNotFoundError: No module named 'storage'`. [service.py](<EVALUATION_PROJECT>/service.py:1)\n\
  \n- **High \u2014 CLI has no executable entry point.** Even after providing storage,\
  \ running `cli.py` would only define `main`; it never calls it and provides no argument\
  \ parsing or output. [cli.py](<EVALUATION_PROJECT>/cli.py:3)\n\n### Adoption\n\n\
  - **Critical \u2014 documented onboarding command references a nonexistent file.**\
  \ The README directs users to `python quickstart.py`, but the repository contains\
  \ no `quickstart.py`. [README.md](<EVALUATION_PROJECT>/README.md:3)\n\n- **High\
  \ \u2014 no usable setup guidance.** There is no dependency manifest, supported-Python\
  \ version, storage configuration, example invocation, expected output, or troubleshooting\
  \ guidance. This prevents a new adopter from running or evaluating the project.\n\
  \n### Maintenance\n\n- **High \u2014 the dependency-security policy is unenforceable\
  \ from this repository.** The policy says deployment must reject critical vulnerabilities,\
  \ while the README says checks happen during deployment; however, no dependency\
  \ declaration, deployment workflow, CI configuration, or evidence of enforcement\
  \ is included. [POLICY.md](<EVALUATION_PROJECT>/POLICY.md:3), [README.md](<EVALUATION_PROJECT>/README.md:3)\n\
  \n- **High \u2014 no automated tests exist.** The missing storage dependency and\
  \ non-executing CLI would both have been caught by a basic import/smoke test.\n\n\
  Priority order: add the storage implementation or declared dependency, make the\
  \ CLI executable, correct the README quickstart, then add packaging, tests, and\
  \ verifiable dependency scanning."
