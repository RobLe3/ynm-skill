output: "## Verdict: Not operationally ready\n\nAvailable project evidence is limited\
  \ to a three-line recovery runbook. It explicitly states that recovery has **not\
  \ been tested in a production-like environment**: [RUNBOOK.md](<<EVALUATION_PROJECT>/RUNBOOK.md:3>).\n\
  \nKey blockers:\n\n- Recovery depends on `restore --latest`, with no prerequisites,\
  \ parameters, environment selection, authentication, or failure handling.\n- \u201C\
  Verify record counts\u201D provides no commands, expected values, reconciliation\
  \ criteria, or acceptance threshold.\n- No demonstrated restore test, backup-integrity\
  \ check, RTO, or RPO.\n- No evidence of deployment/rollback procedures, monitoring,\
  \ alerting, health checks, incident response, ownership, escalation, or security\
  \ controls.\n- No application source, tests, infrastructure configuration, CI/CD\
  \ configuration, or version-control metadata is present to assess deployability\
  \ or reliability.\n\nEvidence not present should be treated as **unverified**, not\
  \ necessarily nonexistent. Still, the untested recovery procedure alone is a release\
  \ blocker. A production-like restore exercise with documented results and measurable\
  \ acceptance criteria is the minimum requirement before reassessment."
