raw_output: "YNM stands for **YES / NO / MAYBE**. It\u2019s a structured way to review\
  \ a project using evidence instead of giving it a vague score.\n\nIt works like\
  \ this:\n\n1. **Define specific questions**  \n   For example: \u201CDoes the architecture\
  \ support the expected scale?\u201D\n\n2. **Inspect the evidence**  \n   YNM examines\
  \ relevant code, documents, tests, processes, and project history.\n\n3. **Review\
  \ from several angles**  \n   Depending on the project, it can assess architecture,\
  \ implementation, adoption, maintenance, and how conflicting findings are resolved.\n\
  \n4. **Label each conclusion**\n   - **YES** \u2014 the evidence supports the claim.\n\
  \   - **NO** \u2014 the evidence contradicts it.\n   - **MAYBE** \u2014 there isn\u2019\
  t enough reliable evidence yet.\n\n5. **Preserve uncertainty and disagreements**\
  \  \n   It records what was reviewed, what wasn\u2019t, conflicting evidence, and\
  \ why each conclusion was reached.\n\n6. **Stop when another pass won\u2019t add\
  \ useful information**  \n   The final report explains coverage, findings, limitations,\
  \ and sensible next steps.\n\nA crucial detail: **YES does not mean \u201Capproved,\u201D\
  \ and NO does not automatically authorize a fix.** YNM reviews projects in read-only\
  \ mode by default; changing the project requires separate permission.\n\nIn short,\
  \ YNM turns \u201CIs this project in good shape?\u201D into a collection of precise,\
  \ evidence-backed answers."
