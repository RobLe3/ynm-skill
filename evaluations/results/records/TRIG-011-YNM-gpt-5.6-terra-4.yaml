raw_output: "YNM is a structured way to review a project without jumping straight\
  \ to fixes.\n\nIt breaks the review into focused lenses\u2014such as architecture,\
  \ implementation quality, adoption, and maintainability. For each important claim,\
  \ it gathers evidence and gives one of three outcomes:\n\n- **YES** \u2014 the evidence\
  \ supports it.\n- **NO** \u2014 the evidence contradicts it.\n- **MAYBE** \u2014\
  \ there isn\u2019t enough reliable evidence yet.\n\nThe key idea is to keep facts,\
  \ interpretations, recommendations, and permissions separate. So \u201Cthis looks\
  \ broken\u201D does not automatically mean \u201Cgo change it.\u201D\n\nA typical\
  \ YNM run is:\n\n1. Define what is being reviewed and what authority exists.\n2.\
  \ Inspect the relevant evidence.\n3. Evaluate focused questions through the applicable\
  \ review loops.\n4. Revisit only if another pass is likely to reveal something meaningful.\n\
  5. Deliver a clear report: what was reviewed, what wasn\u2019t, the YES/NO/MAYBE\
  \ findings, uncertainties, and suggested handoffs.\n\nBy default, it is read-only:\
  \ YNM identifies and explains issues; changes require explicit authorization."
