name: ynm-ci

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ynm-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: repository preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate repository-wide invariants
        run: |
          python validation/validate_ynm.py --check preflight
          python validation/validate_release_integrity.py
      - name: Test repository evidence diagnostics
        run: python -m unittest tests.test_repository_validation -v

  validate:
    name: validate (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate cross-platform invariants
        run: python validation/validate_ynm.py --check cross-platform
      - name: Run portable contract and lifecycle tests
        run: python -m unittest tests.test_validate_ynm tests.test_trigger_cases -v

  package:
    name: package-and-verify
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build and verify package
        run: |
          python scripts/build_skill_package.py --output-dir dist --overwrite
          python - <<'PY'
          from pathlib import Path
          import yaml, hashlib

          package = Path('dist/ynm')
          assert package.exists(), 'package not found'
          assert (package / 'SKILL.md').exists(), 'SKILL.md missing from package'
          assert (package / 'manifest.yaml').exists(), 'manifest missing from package'
          assert (package / 'contracts').is_dir(), 'contracts missing from package'

          signature = hashlib.sha256()
          files = sorted(package.rglob('*'))
          for file_path in files:
              if not file_path.is_file():
                  continue
              relative = file_path.relative_to(package)
              signature.update(str(relative).encode('utf-8'))
              signature.update(file_path.read_bytes())
          print('Package signature:', signature.hexdigest())
          package_manifest = yaml.safe_load((package / 'package-manifest.yaml').read_text(encoding='utf-8'))
          assert package_manifest['name'] == 'ynm'
          print('Package version:', package_manifest['manifest_version'])
          PY
      - name: Validate generated package structure
        run: |
          python - <<'PY'
          from pathlib import Path
          package = Path('dist/ynm')
          assert package.is_dir(), 'package root missing'
          for required in ['SKILL.md', 'README.md', 'manifest.yaml', 'contracts', 'loops', 'methodology', 'schemas']:
              assert (package / required).exists(), f'missing {required} in package'
          print('Generated package root:', package)
          PY
      - name: Test generated package behavior
        run: |
          python validation/validate_ynm.py --check package-links
          python -m unittest tests.test_package_security tests.test_release_and_package.PackageBuildTests -v
      - name: Validate package with pinned Agent Skills reference validator
        env:
          AGENTSKILLS_REF: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
        shell: bash
        run: |
          mkdir -p .tmp
          git clone --filter=blob:none https://github.com/agentskills/agentskills.git .tmp/agentskills
          git -C .tmp/agentskills checkout "$AGENTSKILLS_REF"
          python -m pip install ./.tmp/agentskills/skills-ref
          skills-ref validate dist/ynm
          skills-ref read-properties dist/ynm

  security:
    name: security-boundary checks
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run security-boundary checks
        run: |
          python validation/validate_ynm.py --check security-boundary
          python -m unittest tests.test_project_integration_security tests.test_package_security -v
      - name: Ensure sanitization report exists for candidate
        run: |
          test -f state/releases/$(cat VERSION)/sanitization-report.yaml
          test -f state/releases/$(cat VERSION)/publication.yaml

  release-integrity-tag:
    name: release-integrity (tagged commit)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [preflight, validate, package, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify tagged commit and release evidence
        run: |
          REF_VERSION="${GITHUB_REF_NAME#v}"
          EXPECTED_VERSION="$(cat VERSION)"
          test "$REF_VERSION" = "$EXPECTED_VERSION"
          git fetch origin main:refs/remotes/origin/main --tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python validation/validate_release_integrity.py \
            --release "$REF_VERSION" \
            --require-tagged-subject \
            --tag-ref "$GITHUB_REF_NAME"
