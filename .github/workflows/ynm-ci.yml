name: ynm-ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4
      - name: Enforce normalized text checkout behavior
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Validate schemas and repository invariants
        run: python3 validation/validate_ynm.py
      - name: Validate release integrity
        run: python3 validation/validate_release_integrity.py --release $(cat VERSION)
      - name: Run unit/integration tests
        run: python3 -m unittest discover -s tests -v

  package:
    name: package-and-verify
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Enforce normalized text checkout behavior
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Build and verify package
        run: |
          python3 scripts/build_skill_package.py --output-dir dist --overwrite
          python3 - <<'PY'
          from pathlib import Path
          import yaml, hashlib

          package = Path('dist/ynm')
          assert package.exists(), 'package not found'
          assert (package / 'SKILL.md').exists(), 'SKILL.md missing from package'
          assert (package / 'manifest.yaml').exists(), 'manifest missing from package'
          assert (package / 'contracts').is_dir(), 'contracts missing from package'

          signature = hashlib.sha256()
          files = sorted(package.rglob('*'))
          for file_path in files:
              if not file_path.is_file():
                  continue
              relative = file_path.relative_to(package)
              signature.update(str(relative).encode('utf-8'))
              signature.update(file_path.read_bytes())
          print('Package signature:', signature.hexdigest())
          package_manifest = yaml.safe_load((package / 'package-manifest.yaml').read_text(encoding='utf-8'))
          assert package_manifest['name'] == 'ynm'
          print('Package version:', package_manifest['manifest_version'])
          PY
      - name: Validate generated package structure
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          package = Path('dist/ynm')
          assert package.is_dir(), 'package root missing'
          for required in ['SKILL.md', 'README.md', 'manifest.yaml', 'contracts', 'loops', 'methodology', 'schemas']:
              assert (package / required).exists(), f'missing {required} in package'
          print('Generated package root:', package)
          PY
      - name: Optional Agent Skills validator
        shell: bash
        run: |
          if command -v skills-ref >/dev/null 2>&1; then
            skills-ref validate dist/ynm
            skills-ref read-properties dist/ynm
          else
            echo "skills-ref unavailable in CI; skipping optional adapter check."
          fi

  security:
    name: security-boundary checks
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Enforce normalized text checkout behavior
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run trigger/metadata checks
        run: python3 -m unittest discover -s tests -v
      - name: Ensure sanitization report exists for candidate
        run: |
          test -f state/releases/$(cat VERSION)/sanitization-report.yaml
          test -f state/releases/$(cat VERSION)/publication.yaml


  release-integrity-tag:
    name: release-integrity (tagged commit)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce normalized text checkout behavior
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Verify tagged commit and release evidence
        run: |
          REF_VERSION="${GITHUB_REF_NAME#v}"
          python3 validation/validate_release_integrity.py --release "$REF_VERSION" --require-publication-tree
